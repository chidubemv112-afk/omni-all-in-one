const STATES=Object.keys(NIGERIA).sort();
let debts=JSON.parse(localStorage.getItem('omni_debts')||'[]');
let farms=JSON.parse(localStorage.getItem('omni_farms')||'[]');
let coins=parseInt(localStorage.getItem('omni_coins')||'0');
let wallet=parseInt(localStorage.getItem('omni_wallet')||'0');
let photoB64='',farmPhotoB64='';
function init(){
  let sf=document.getElementById('stateFilter'),cs=document.getElementById('cState'),fs=document.getElementById('farmState');
  STATES.forEach(s=>{let o=document.createElement('option');o.value=s;o.textContent=s; sf.appendChild(o.cloneNode(true)); cs.appendChild(o); let o2=o.cloneNode(true); fs.appendChild(o2);});
  document.getElementById('farmState').addEventListener('change',()=>populateLGA('farmState','farmLGA'));
  renderDebts(); renderFarms(); updateWallet();
}
function populateLGA(sId,lId){let s=document.getElementById(sId).value, lga=document.getElementById(lId); lga.innerHTML='<option>Select LGA</option>'; if(NIGERIA[s]) NIGERIA[s].forEach(l=>{let o=document.createElement('option');o.value=l;o.textContent=l; lga.appendChild(o);});}
function onStateChange(){populateLGA('stateFilter','lgaFilter'); renderDebts();}
document.getElementById('cPhoto').addEventListener('change',function(){let f=this.files[0]; if(!f) return; let r=new FileReader(); r.onload=e=>photoB64=e.target.result; r.readAsDataURL(f);});
document.getElementById('farmPhoto').addEventListener('change',function(){let f=this.files[0]; if(!f) return; let r=new FileReader(); r.onload=e=>farmPhotoB64=e.target.result; r.readAsDataURL(f);});
function switchWorld(w,el){document.querySelectorAll('.world').forEach(b=>b.classList.remove('active')); el.classList.add('active'); document.querySelectorAll('.view').forEach(v=>v.classList.remove('active')); document.getElementById('view-'+w).classList.add('active');}
function openDebt(){document.getElementById('debtOverlay').classList.add('show');}
function closeOverlay(id){document.getElementById(id).classList.remove('show');}
function openArtisan(){let name=prompt('Artisan name?'); if(!name) return; let skill=prompt('Skill?'); let phone=prompt('Phone?'); let rec={id:Date.now(), name: skill+' - '+name, phone, state:'Delta', lga:'Warri South', items:'Artisan', amount:0, status:'artisan'}; debts.push(rec); localStorage.setItem('omni_debts', JSON.stringify(debts)); renderDebts(); addCoins(2);}
function saveDebt(){let name=document.getElementById('cName').value.trim(), phone=document.getElementById('cPhone').value.trim(), state=document.getElementById('cState').value, lga=document.getElementById('cLGA').value, items=document.getElementById('dItems').value.trim(), amount=parseInt(document.getElementById('dAmount').value)||0, due=document.getElementById('dDue').value; if(!name||!amount){alert('Name and amount required'); return;} let rec={id:Date.now(), name, phone, state: state.includes('Select')?'':state, lga: lga.includes('Select')?'':lga, items, amount, dueDate: due||new Date().toISOString().slice(0,10), status:'owed', photo:photoB64}; debts.unshift(rec); localStorage.setItem('omni_debts', JSON.stringify(debts)); closeOverlay('debtOverlay'); renderDebts(); addCoins(5);}
function renderDebts(){let q=(document.getElementById('searchDebt').value||'').toLowerCase(), sF=document.getElementById('stateFilter').value, lF=document.getElementById('lgaFilter').value; let filtered=debts.filter(d=>{if(q && !(d.name.toLowerCase().includes(q)||(d.phone||'').includes(q))) return false; if(sF && d.state!==sF) return false; if(lF && d.lga!==lF) return false; return true;}); let total=filtered.filter(d=>d.status==='owed').reduce((a,b)=>a+b.amount,0), overdue=filtered.filter(d=>d.status==='owed' && d.dueDate && new Date(d.dueDate)<new Date()).length; document.getElementById('totalOwed').textContent='₦'+total.toLocaleString(); document.getElementById('overdueCount').textContent=overdue; document.getElementById('totalArtisans').textContent=filtered.filter(d=>d.status==='artisan').length; let list=document.getElementById('debtList'); if(filtered.length===0){list.innerHTML='<div class=card style=text-align:center;color:#555>No records</div>'; return;} list.innerHTML=filtered.map(d=>{let waText=encodeURIComponent('Hello '+d.name+', balance ₦'+(d.amount||0).toLocaleString()+' - OMNI'); let phoneClean=(d.phone||'').replace(/[^0-9]/g,'').replace(/^0/,'234'); let waLink='https://wa.me/'+phoneClean+'?text='+waText; return '<div class=item><div style=flex:1><div style=font-weight:900>'+d.name+'</div><div style=font-size:10px;color:#888>'+d.state+' • '+d.lga+'</div></div><div><a href='+waLink+' target=_blank style=font-size:10px;background:#25D366;color:#000;padding:4px 8px;border-radius:100px;font-weight:800;text-decoration:none>WhatsApp</a></div></div>';}).join('');}
function addFarm(){let crop=document.getElementById('farmCrop').value, qty=document.getElementById('farmQty').value, price=document.getElementById('farmPrice').value, state=document.getElementById('farmState').value, lga=document.getElementById('farmLGA').value; if(!qty||!price){alert('Qty and price needed'); return;} let rec={id:Date.now(), crop, qty, price, state, lga, photo:farmPhotoB64, timestamp:new Date().toISOString()}; farms.unshift(rec); localStorage.setItem('omni_farms', JSON.stringify(farms)); renderFarms(); addCoins(10); wallet+= parseInt(qty)*parseInt(price)*0.03; localStorage.setItem('omni_wallet', wallet); updateWallet();}
function renderFarms(){document.getElementById('farmCount').textContent=farms.length; let list=document.getElementById('farmList'); if(farms.length===0){list.innerHTML='<div class=card style=text-align:center;color:#555>No crops</div>'; return;} list.innerHTML=farms.map(f=>'<div class=item><div style=flex:1><div style=font-weight:900>'+f.crop+' • '+f.qty+'kg</div><div style=font-size:10px;color:#888>'+f.state+' • '+f.lga+'</div></div><div style=font-weight:900;color:#00FF88>₦'+(f.qty*f.price).toLocaleString()+'</div></div>').join(''); document.getElementById('farmSold').textContent='₦'+farms.reduce((a,b)=>a+Number(b.qty)*Number(b.price),0).toLocaleString();}
function askScience(){let q=document.getElementById('scienceQ').value.trim(); if(!q) return; let ans=document.getElementById('scienceAns'); ans.innerHTML='Thinking...'; setTimeout(()=>{ans.innerHTML='<b>OMNI AI:</b> For '+q+' - In Delta soil, too much water + fungus. Mix neem leaf water + spray morning. Earn 5 OC.'; addCoins(5);},1000);}
function updateWallet(){document.getElementById('walletBal').textContent='₦'+wallet.toLocaleString(); document.getElementById('omniCoins').textContent=coins+' OC';}
function addCoins(n){coins+=n; localStorage.setItem('omni_coins', coins); updateWallet();}
let alive=1000000, round=1, playerAlive=true, roundTimer;
function start1M(){document.getElementById('gameArea').style.display='block'; alive=1000000; round=1; playerAlive=true; startRound1M(1);}
function startRound1M(r){round=r; if(r>3){win1M(); return;} document.getElementById('roundLabel').textContent='ROUND '+r+' / 3'; document.getElementById('aliveLabel').textContent='ALIVE: '+alive.toLocaleString(); let content=document.getElementById('roundContent'); if(r===1){content.innerHTML='<div style=font-weight:900;margin-top:12px>TAP WHEN GREEN</div><div class=tapper wait id=t1 onclick=tapG()>WAIT...</div>'; setTimeout(()=>{let el=document.getElementById('t1'); if(el){el.className='tapper green'; el.textContent='TAP NOW!';}},1500); prog(4,function(){die1M();});} else if(r===2){content.innerHTML='<div style=font-weight:900;margin-top:12px>TAP 5 TIMES</div><div class=tapper wait id=t5>0/5</div>'; let c=0; document.getElementById('t5').onclick=function(){c++; document.getElementById('t5').textContent=c+'/5'; if(c>=5) next1M();}; prog(5,function(){die1M();});} else if(r===3){content.innerHTML='<div style=font-weight:900;margin-top:12px>LAST TAP TO WIN $500</div><div class=tapper style=background:#FFD600;color:#000 onclick=win1M()>WIN NOW!</div>'; prog(5,function(){die1M();});}}
function prog(sec,cb){let bar=document.getElementById('roundProg'); if(!bar) return; bar.style.transition='none'; bar.style.width='100%'; setTimeout(function(){bar.style.transition='width '+sec+'s linear'; bar.style.width='0%';},50); if(roundTimer) clearTimeout(roundTimer); roundTimer=setTimeout(cb, sec*1000);}
function tapG(){let el=document.getElementById('t1'); if(el.classList.contains('wait')) die1M(); else next1M();}
function next1M(){alive=Math.floor(alive/2); document.getElementById('aliveLabel').textContent='ALIVE: '+alive.toLocaleString(); setTimeout(function(){startRound1M(round+1);},600);}
function die1M(){playerAlive=false; let rank=alive+Math.floor(Math.random()*1000); document.getElementById('roundContent').innerHTML='<div style=background:#FF0033;padding:20px;border-radius:16px;margin-top:12px;text-align:center><div style=font-size:24px;font-weight:900>DIED AT #'+rank.toLocaleString()+'</div></div>';}
function win1M(){addCoins(50); wallet+=800000; localStorage.setItem('omni_wallet', wallet); updateWallet(); document.getElementById('roundContent').innerHTML='<div style=background:#FFD600;color:#000;padding:20px;border-radius:16px;margin-top:12px;text-align:center><div style=font-size:28px;font-weight:900>YOU WON $500!</div></div>';}
init();
</script></body></html>
